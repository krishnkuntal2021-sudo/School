<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node AI Pro</title>
<style>
:root{--bg:#000;--panel:#171717;--button:#2d2d2d;--text:#f7f7f7;--muted:#aaa;--accent:#4385ff;--border:#454545}
body.light{--bg:#fff;--panel:#f5f5f5;--button:#e8e8e8;--text:#111;--muted:#666;--accent:#3478f6;--border:#ddd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer;color:var(--text);border:0}
.app{height:100dvh;display:flex;flex-direction:column}
header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;flex-shrink:0}
.headleft,.headright{display:flex;align-items:center;gap:12px}
.round,.newchat{width:49px;height:49px;border-radius:50%;background:var(--button);border:1px solid var(--border);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.brand{font-size:24px;font-weight:600}
.messages{flex:1;min-height:0;overflow-y:auto;padding:16px 15px 24px}
.welcome{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}
.welcome h1{font-size:29px;font-weight:500;margin:0 0 10px}
.welcome p{color:var(--muted);margin:0}
.message{max-width:850px;margin:0 auto 26px;line-height:1.65;overflow-wrap:anywhere}
.userrow{display:flex;justify-content:flex-end}
.userbubble{max-width:88%;background:var(--panel);border-radius:22px;padding:12px 16px;white-space:pre-wrap}
.ailabel{color:var(--muted);font-size:13px;margin-bottom:5px}
.aitext{white-space:pre-wrap}
.actions{display:flex;align-items:center;gap:7px;margin-top:12px;flex-wrap:wrap}
.iconbtn{background:transparent;color:var(--muted);font-size:20px;min-width:35px;height:35px;border-radius:9px;padding:4px 7px}
.iconbtn:hover,.iconbtn.active{background:var(--button);color:var(--text)}
.morewrap{position:relative}
.moremenu{display:none;position:absolute;bottom:42px;right:0;width:230px;padding:7px;background:#303030;border:1px solid #555;border-radius:17px;box-shadow:0 8px 30px #0009;z-index:10}
body.light .moremenu{background:#f2f2f2;border-color:#ccc}
.moremenu.open{display:block}
.moremenu button{display:block;width:100%;text-align:left;padding:13px 12px;background:transparent;border-radius:10px;font-size:15px}
.moremenu button:hover{background:#5553}
.menu-sep{height:1px;background:#666;margin:5px}
.composerarea{padding:8px 13px 10px;flex-shrink:0}
.composer{max-width:850px;margin:auto;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;background:var(--panel);border:1px solid var(--border);border-radius:30px}
.attachbtn{width:38px;height:42px;flex-shrink:0;background:transparent;color:var(--text);font-size:23px;border-radius:12px}
.attachbtn:hover{background:var(--button)}
.imagepreview{max-width:850px;margin:0 auto 8px;display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border:1px solid var(--border);border-radius:14px}
.imagepreview img{width:54px;height:54px;object-fit:cover;border-radius:8px}
.imagepreview .previewname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px}
.imagepreview button{background:var(--button);border-radius:9px;padding:8px 11px}
.userimage{display:block;max-width:min(280px,75vw);max-height:300px;object-fit:contain;border-radius:14px;margin-bottom:8px;border:1px solid var(--border)}
.plus{width:40px;height:42px;background:transparent;font-size:30px;flex-shrink:0}
textarea{flex:1;min-width:0;max-height:140px;resize:none;background:transparent;color:var(--text);border:0;outline:0;padding:12px 0;font-size:17px}
textarea::placeholder{color:var(--muted)}
.send{width:47px;height:47px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;flex-shrink:0}
.send:disabled{opacity:.6}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:0 8px 8px;flex-shrink:0}
.drawer{display:none;position:fixed;z-index:20;top:0;left:0;height:100%;width:min(310px,86vw);padding:18px 14px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto}
.drawer.open{display:block}
.drawertop{display:flex;align-items:center;justify-content:space-between;font-size:22px;font-weight:bold;margin-bottom:22px}
.drawer button{width:100%;text-align:left;padding:14px;background:var(--button);border-radius:12px;margin-bottom:8px}
.drawer .xbtn{width:42px;text-align:center;font-size:22px}
.historytitle{font-size:12px;color:var(--muted);margin:22px 5px 10px}
.historyitem{display:flex;gap:5px}
.historyitem button:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.historyitem button:last-child{width:40px;flex-shrink:0;text-align:center}
dialog{width:min(430px,92vw);background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:22px}
dialog::backdrop{background:#000b}
dialog label{display:block;margin:14px 0 7px}
dialog input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.dialogbuttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
.dialogbuttons button{background:var(--button);padding:11px 13px;border-radius:10px}
.dialogbuttons .save{background:var(--accent);color:#fff}
.note{font-size:12px;line-height:1.5;color:var(--muted)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 15px;border-radius:12px;display:none;z-index:30;font-size:14px;max-width:90vw;text-align:center}
@media(max-width:500px){header{padding:0 12px}.brand{font-size:22px}.round,.newchat{width:45px;height:45px}.messages{padding:14px 12px}.welcome h1{font-size:26px}.actions{gap:3px}.iconbtn{min-width:32px}.composerarea{padding:8px 10px}}

/* Long-press menu for user prompts */
.userbubble{user-select:text;-webkit-user-select:text;touch-action:pan-y}
.userbubble img.userimage{display:block;max-width:min(260px,70vw);max-height:260px;object-fit:contain;border-radius:12px;margin-bottom:6px}
.prompt-context-menu{display:none;position:fixed;z-index:1000;width:min(310px,88vw);padding:8px;background:#303030;color:#fff;border:1px solid #555;border-radius:20px;box-shadow:0 10px 35px #0009}
body.light .prompt-context-menu{background:#f2f2f2;color:#111;border-color:#ccc}
.prompt-context-menu.open{display:block}
.prompt-context-menu .menu-date{font-size:12px;color:#aaa;padding:12px 14px 10px}
.prompt-context-menu button{display:block;width:100%;text-align:left;padding:14px 13px;border:0;background:transparent;color:inherit;border-radius:11px;font-size:16px}
.prompt-context-menu button:hover{background:#ffffff18}

</style>
</head>
<body>
<div class="app">
<header>
  <div class="headleft">
    <button class="round" onclick="toggleDrawer()" aria-label="Open menu">☰</button>
    <div class="brand">Node AI</div>
  </div>
  <div class="headright">
    <button class="newchat" onclick="newChat()" aria-label="New chat">＋</button>
  </div>
</header>
<main class="messages" id="messages"></main>
<div class="composerarea">
  <div class="imagepreview" id="imagePreview"><img id="previewImg" alt="Selected image preview"><div class="previewname" id="previewName"></div><button type="button" onclick="clearImage()" aria-label="Remove image">×</button></div>
  <form class="composer" id="chatForm">
    <button class="plus" type="button" onclick="openSettings()" aria-label="Settings">＋</button>
    <button class="attachbtn" type="button" onclick="$('imageInput').click()" aria-label="Attach image" title="Upload image">▧</button>
    <input id="imageInput" type="file" accept="image/*" hidden>
    <textarea id="prompt" rows="1" placeholder="Message Node AI" aria-label="Message Node AI"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">➤</button>
  </form>
</div>
<div class="footer">Node AI can make mistakes. Check important information.</div>
</div>

<aside class="drawer" id="drawer">
  <div class="drawertop"><span>Node AI</span><button class="xbtn" onclick="toggleDrawer()">×</button></div>
  <button onclick="newChat();toggleDrawer()">＋ &nbsp; New chat</button>
  <button onclick="openSettings()">⚙ &nbsp; Settings & API</button>
  <button onclick="searchChats()">⌕ &nbsp; Search chats</button>
  <button onclick="toggleTheme()">◐ &nbsp; Change theme</button>
  <div class="historytitle">CHAT HISTORY</div><div id="history"></div>
</aside>

<dialog id="settings">
  <h2>Node AI settings</h2>
  <label for="apiKey">OpenRouter API key</label>
  <input id="apiKey" type="password" placeholder="Enter API key" autocomplete="off">
  <label for="model">Model ID</label>
  <input id="model" value="openai/gpt-4o-mini" placeholder="provider/model-name">
  <p class="note">The API key is kept in this browser session. Do not publish it in public HTML or leave it on a shared school computer.</p>
  <div class="dialogbuttons">
    <button class="save" onclick="saveSettings()">Save</button>
    <button onclick="clearKey()">Clear key</button>
    <button onclick="closeSettings()">Close</button>
  </div>
</dialog>
<div class="prompt-context-menu" id="promptContextMenu" role="menu" aria-label="Message options">
  <div class="menu-date">Message options</div>
  <button type="button" onclick="promptMenuAction('copy')">▢ &nbsp; Copy</button>
  <button type="button" onclick="promptMenuAction('select')">▤ &nbsp; Select text</button>
  <button type="button" onclick="promptMenuAction('edit')">✎ &nbsp; Edit message</button>
  <button type="button" onclick="promptMenuAction('share')">↗ &nbsp; Share prompt</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const CREATOR_REPLY = "I am Node AI, created by Aditya, Pararav, Rajat, and Yogesh! They built me as their AI school project.";
let chats = [], currentId = null, busy = false, controller = null, toastTimer = null;
let feedback = {};

function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function currentChat(){return chats.find(c=>c.id===currentId)}
function saveChats(){try{localStorage.setItem("node_pro_chats",JSON.stringify(chats))}catch(e){}}
function toast(message){
  const el=$("toast");el.textContent=message;el.style.display="block";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display="none",2400);
}
function createChat(messages=[]){
  const c={id:makeId(),title:"New chat",messages};
  const first=messages.find(m=>m.role==="user");
  if(first)c.title=first.content.slice(0,32)+(first.content.length>32?"…":"");
  chats.unshift(c);currentId=c.id;saveChats();return c;
}
function newChat(){stopGeneration();createChat();renderHistory();renderMessages();$("prompt").focus()}
function toggleDrawer(){$("drawer").classList.toggle("open")}
function openSettings(){
  $("apiKey").value=sessionStorage.getItem("node_key")||"";
  $("model").value=sessionStorage.getItem("node_model")||"openai/gpt-4o-mini";
  $("settings").showModal();
}
function closeSettings(){$("settings").close()}
function saveSettings(){
  sessionStorage.setItem("node_key",$("apiKey").value.trim());
  sessionStorage.setItem("node_model",$("model").value.trim()||"openai/gpt-4o-mini");
  closeSettings();toast("Settings saved for this session.");
}
function clearKey(){$("apiKey").value="";sessionStorage.removeItem("node_key");toast("API key cleared.")}
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("node_pro_theme",document.body.classList.contains("light")?"light":"dark");
}
function searchChats(){
  const q=prompt("Search chat titles:");
  if(q!==null)renderHistory(q.trim());
}
function deleteChat(id){
  if(busy&&currentId===id)stopGeneration();
  chats=chats.filter(c=>c.id!==id);
  if(!chats.length)createChat();
  if(!chats.some(c=>c.id===currentId))currentId=chats[0].id;
  saveChats();renderHistory();renderMessages();
}
function renderHistory(filter=""){
  const box=$("history");box.replaceChildren();
  chats.filter(c=>c.title.toLowerCase().includes(filter.toLowerCase())).forEach(c=>{
    const row=document.createElement("div");row.className="historyitem";
    const open=document.createElement("button");open.textContent="▢  "+c.title;
    open.onclick=()=>{stopGeneration();currentId=c.id;renderHistory();renderMessages();if(innerWidth<600)$("drawer").classList.remove("open")};
    const del=document.createElement("button");del.textContent="×";del.setAttribute("aria-label","Delete chat");
    del.onclick=()=>{if(confirm("Delete this chat?"))deleteChat(c.id)};
    row.append(open,del);box.append(row);
  });
}
function renderMessages(){
  const box=$("messages");box.replaceChildren();
  const chat=currentChat();
  if(!chat||!chat.messages.length){
    const w=document.createElement("div");w.className="welcome";
    const inner=document.createElement("div"),h=document.createElement("h1"),p=document.createElement("p");
    h.textContent="What can I help with?";p.textContent="Ask anything. Let's chat.";
    inner.append(h,p);w.append(inner);box.append(w);return;
  }
  chat.messages.forEach((m,index)=>{
    const row=document.createElement("div");row.className="message";
    if(m.role==="user"){
      row.classList.add("userrow");
      const bubble=document.createElement("div");bubble.className="userbubble";
      bubble.dataset.chatId=chat.id;bubble.dataset.messageIndex=index;
      if(m.image){const im=document.createElement("img");im.className="userimage";im.src=m.image;im.alt="Uploaded image";bubble.append(im)}
      if(m.content){const caption=document.createElement("div");caption.textContent=m.content;bubble.append(caption)}
      let holdTimer=null,startX=0,startY=0;
      bubble.addEventListener("pointerdown",ev=>{
        if(ev.pointerType==="mouse"&&ev.button!==0)return;
        startX=ev.clientX;startY=ev.clientY;clearTimeout(holdTimer);
        holdTimer=setTimeout(()=>showPromptMenu(chat.id,index,ev.clientX,ev.clientY),520);
      });
      bubble.addEventListener("pointermove",ev=>{
        if(Math.abs(ev.clientX-startX)>12||Math.abs(ev.clientY-startY)>12)clearTimeout(holdTimer);
      });
      ["pointerup","pointercancel","pointerleave"].forEach(type=>bubble.addEventListener(type,()=>clearTimeout(holdTimer)));
      bubble.addEventListener("contextmenu",ev=>{ev.preventDefault();showPromptMenu(chat.id,index,ev.clientX,ev.clientY)});
      row.append(bubble);
    }else{
      const label=document.createElement("div");label.className="ailabel";label.textContent="Node AI";
      const text=document.createElement("div");text.className="aitext";text.textContent=m.content;
      row.append(label,text);
      const actions=document.createElement("div");actions.className="actions";
      actions.append(
        actionButton("▢","Copy","copy",chat.id,index),
        actionButton("👍","Like","like",chat.id,index),
        actionButton("👎","Dislike","dislike",chat.id,index),
        actionButton("🔊","Read aloud","speak",chat.id,index),
        actionButton("↗","Share","share",chat.id,index)
      );
      const wrap=document.createElement("div");wrap.className="morewrap";
      const more=actionButton("⋮","More options","more",chat.id,index);
      const menu=document.createElement("div");menu.className="moremenu";
      const branch=document.createElement("button");branch.textContent="⑂  Branch in new chat";
      branch.onclick=()=>branchChat(chat.id,index);
      const retry=document.createElement("button");retry.textContent="⟳  Retry";
      retry.onclick=()=>retryAnswer(chat.id,index);
      const sep=document.createElement("div");sep.className="menu-sep";
      const web=document.createElement("button");web.textContent="◎  Search the web";
      web.onclick=()=>searchWeb(chat.id,index);
      menu.append(branch,retry,sep,web);wrap.append(more,menu);actions.append(wrap);
      more.onclick=()=>{document.querySelectorAll(".moremenu.open").forEach(x=>{if(x!==menu)x.classList.remove("open")});menu.classList.toggle("open")};
      actions.querySelectorAll("button[data-action]").forEach(btn=>{
        const k=btn.dataset.action;
        if(k==="more")return;
        btn.onclick=()=>handleAction(k,chat.id,index,btn);
      });
      row.append(actions);
    }
    box.append(row);
  });
  box.scrollTop=box.scrollHeight;
}

let promptMenuTarget=null;
function showPromptMenu(chatId,index,x,y){
  const menu=$("promptContextMenu");
  promptMenuTarget={chatId,index};
  menu.classList.add("open");
  const w=Math.min(310,window.innerWidth*0.88);
  const h=menu.offsetHeight||280;
  const left=Math.max(8,Math.min(x||window.innerWidth/2,window.innerWidth-w-8));
  let top=(y||window.innerHeight/2)+8;
  if(top+h>window.innerHeight-8)top=Math.max(8,(y||window.innerHeight/2)-h-8);
  menu.style.left=left+"px";menu.style.top=top+"px";
}
function closePromptMenu(){
  const menu=$("promptContextMenu");
  if(menu)menu.classList.remove("open");
  promptMenuTarget=null;
}
async function promptMenuAction(action){
  if(!promptMenuTarget)return;
  const target={...promptMenuTarget};
  const found=findMessage(target.chatId,target.index);
  if(!found){closePromptMenu();return}
  const text=found.message.content||"";
  closePromptMenu();
  if(action==="copy"){
    try{await navigator.clipboard.writeText(text);toast("Prompt copied.")}
    catch{fallbackCopy(text)}
  }else if(action==="select"){
    const bubble=document.querySelector('.userbubble[data-chat-id="'+target.chatId+'"][data-message-index="'+target.index+'"]');
    if(bubble){
      const range=document.createRange();range.selectNodeContents(bubble);
      const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);
      toast("Text selected. You can now copy it.");
    }
  }else if(action==="edit"){
    stopGeneration();
    currentId=found.chat.id;
    found.chat.messages=found.chat.messages.slice(0,target.index);
    $("prompt").value=text;
    $("prompt").style.height="auto";
    $("prompt").style.height=Math.min($("prompt").scrollHeight,140)+"px";
    saveChats();renderHistory();renderMessages();$("prompt").focus();
    toast("Edit the message, then send it again.");
  }else if(action==="share"){
    if(navigator.share){
      try{await navigator.share({title:"Node AI prompt",text:text})}catch(e){}
    }else{
      try{await navigator.clipboard.writeText(text);toast("Sharing unavailable; prompt copied instead.")}
      catch{fallbackCopy(text)}
    }
  }
}
document.addEventListener("click",ev=>{
  if(!ev.target.closest("#promptContextMenu"))closePromptMenu();
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closePromptMenu()});
window.addEventListener("scroll",closePromptMenu,true);

function actionButton(symbol,label,action,chatId,index){
  const b=document.createElement("button");b.className="iconbtn";b.textContent=symbol;b.title=label;b.setAttribute("aria-label",label);b.dataset.action=action;b.dataset.chat=chatId;b.dataset.index=index;return b;
}
function findMessage(chatId,index){
  const c=chats.find(x=>x.id===chatId);return c&&c.messages[index]?{chat:c,message:c.messages[index]}:null;
}
async function handleAction(action,chatId,index,btn){
  const found=findMessage(chatId,index);if(!found)return;
  const text=found.message.content;
  if(action==="copy"){
    try{await navigator.clipboard.writeText(text);toast("Answer copied.")}
    catch{fallbackCopy(text)}
  }else if(action==="like"||action==="dislike"){
    const key=chatId+":"+index;
    feedback[key]=feedback[key]===action?null:action;
    btn.classList.toggle("active",feedback[key]===action);
    toast(feedback[key]==="like"?"Thanks for your feedback!":feedback[key]==="dislike"?"Feedback saved.":"Feedback cleared.");
  }else if(action==="speak"){
    if(!("speechSynthesis" in window)){toast("Read aloud is not supported in this browser.");return}
    if(speechSynthesis.speaking){speechSynthesis.cancel();return}
    const utterance=new SpeechSynthesisUtterance(text);utterance.lang="en-US";speechSynthesis.speak(utterance);
  }else if(action==="share"){
    if(navigator.share){
      try{await navigator.share({title:"Node AI response",text})}catch(e){}
    }else{try{await navigator.clipboard.writeText(text);toast("Sharing isn't available here; answer copied instead.")}catch{fallbackCopy(text)}}
  }
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();
  try{document.execCommand("copy");toast("Answer copied.")}catch{toast("Copy failed; select the answer to copy it.")}
  ta.remove();
}
function branchChat(chatId,index){
  const found=findMessage(chatId,index);if(!found)return;
  stopGeneration();
  const branchMessages=found.chat.messages.slice(0,index+1).map(m=>({...m}));
  createChat(branchMessages);
  renderHistory();renderMessages();$("drawer").classList.remove("open");toast("Branched into a new chat.");
}
function searchWeb(chatId,index){
  const found=findMessage(chatId,index);if(!found)return;
  const query=found.message.content.slice(0,350);
  window.open("https://www.google.com/search?q="+encodeURIComponent(query),"_blank","noopener");
}
async function retryAnswer(chatId,index){
  const found=findMessage(chatId,index);if(!found)return;
  const c=found.chat;
  if(found.message.role!=="assistant"){toast("Retry is available on AI answers.");return}
  stopGeneration();
  c.messages=c.messages.slice(0,index);
  currentId=c.id;
  saveChats();renderHistory();renderMessages();
  await generateAnswer(c);
}
function isCreatorQuestion(text){
  return /\bwho\b.{0,55}\b(made|created|built|developed|programmed)\b.{0,30}\b(you|node ai|this ai)\b|\bwho\b.{0,35}\b(creator|developer|programmer)s?\b|\bwho made (this|your) ai\b|\bwho are your creators\b|\bwho created node ai\b/i.test(text);
}
async function getAnswer(chat,signal){
  const last=chat.messages[chat.messages.length-1];
  if(last&&last.role==="user"&&isCreatorQuestion(last.content)&&!last.image)return CREATOR_REPLY;
  const key=sessionStorage.getItem("node_key");
  const model=sessionStorage.getItem("node_model")||"openai/gpt-4o-mini";
  if(!key)throw new Error("Open Settings (＋) and enter your OpenRouter API key.");
  const response=await fetch("https://openrouter.ai/api/v1/chat/completions",{
    method:"POST",
    headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json"},
    body:JSON.stringify({model,messages:chat.messages.map(m=>({
      role:m.role,
      content: m.role==="user" && m.image
        ? [{type:"text",text:m.content||"Please describe this image and answer my question about it."},{type:"image_url",image_url:{url:m.image}}]
        : m.content
    }))}),
    signal
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error?.message||"API error "+response.status);
  const answer=data.choices?.[0]?.message?.content;
  if(typeof answer!=="string"||!answer.trim())throw new Error("The AI returned an empty response.");
  return answer.trim();
}
async function generateAnswer(chat){
  if(busy)return;
  busy=true;$("send").textContent="■";
  const local=new AbortController();controller=local;
  // temporary loading message
  const loading=document.createElement("div");loading.className="message";loading.id="loading";loading.textContent="Node AI is thinking…";$("messages").append(loading);
  try{
    const answer=await getAnswer(chat,local.signal);
    if(local.signal.aborted)return;
    chat.messages.push({role:"assistant",content:answer});saveChats();renderHistory();
    if(currentId===chat.id)renderMessages();
  }catch(e){
    if(e.name!=="AbortError"&&currentId===chat.id)toast("⚠ "+e.message);
  }finally{
    if(controller===local){controller=null;busy=false;$("send").textContent="➤";const l=$("loading");if(l)l.remove()}
  }
}
let selectedImage = null;
function clearImage(){selectedImage=null;$("imageInput").value="";$("imagePreview").style.display="none";$("previewImg").src="";$("previewName").textContent=""}
$("imageInput").addEventListener("change", async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  if(!file.type.startsWith("image/")){toast("Please select an image file.");clearImage();return}
  if(file.size>5*1024*1024){toast("Please choose an image smaller than 5 MB.");clearImage();return}
  try{
    selectedImage=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
    $("previewImg").src=selectedImage;$("previewName").textContent=file.name;$("imagePreview").style.display="flex";
  }catch{toast("Could not read this image.");clearImage()}
});
async function sendMessage(){
  if(busy)return;
  const input=$("prompt"),text=input.value.trim();if(!text&&!selectedImage)return;
  const chat=currentChat();if(!chat)return;
  const image=selectedImage;
  if(!chat.messages.length)chat.title=(text||"Image question").slice(0,32)+((text||"").length>32?"…":"");
  chat.messages.push({role:"user",content:text,image:image||null});input.value="";input.style.height="auto";clearImage();
  saveChats();renderHistory();renderMessages();await generateAnswer(chat);
}
function stopGeneration(){
  if(controller)controller.abort();controller=null;busy=false;$("send").textContent="➤";
  const l=$("loading");if(l)l.remove();
}
$("chatForm").addEventListener("submit",e=>{e.preventDefault();if(busy)stopGeneration();else sendMessage()});
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!busy)sendMessage()}});
$("prompt").addEventListener("input",()=>{$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,140)+"px"});
document.addEventListener("click",e=>{if(!e.target.closest(".morewrap"))document.querySelectorAll(".moremenu.open").forEach(m=>m.classList.remove("open"))});
try{chats=JSON.parse(localStorage.getItem("node_pro_chats")||"[]");if(!Array.isArray(chats))chats=[]}catch{chats=[]}
if(localStorage.getItem("node_pro_theme")==="light")document.body.classList.add("light");
if(chats.length)currentId=chats[0].id;else createChat();
renderHistory();renderMessages();
</script>
</body>
</html>
